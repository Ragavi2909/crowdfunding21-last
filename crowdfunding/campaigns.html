<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>All Campaigns - GreenFund</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .campaigns-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px,1fr)); gap:30px; padding:20px 0; }
        .campaign-card { background: var(--bg-darker); border-radius:15px; overflow:hidden; transition: transform 0.3s ease, box-shadow 0.3s ease; cursor:pointer; border:1px solid var(--border-color); }
        .campaign-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,255,65,0.2); }
        .campaign-image { position: relative; height:200px; overflow:hidden; }
        .campaign-image img { width:100%; height:100%; object-fit:cover; transition: transform 0.3s ease; }
        .campaign-card:hover .campaign-image img { transform: scale(1.05); }
        .campaign-badge { position:absolute; top:15px; right:15px; background:var(--primary-green); color:var(--bg-black); padding:5px 15px; border-radius:20px; font-size:12px; font-weight:600; }
        .campaign-content { padding:25px; }
        .campaign-content h3 { color:var(--text-white); margin-bottom:10px; font-size:1.3em; }
        .campaign-content p { color:var(--text-light); margin-bottom:20px; line-height:1.6; }
        .campaign-progress { margin-bottom:15px; }
        .progress-bar { background:var(--bg-light); height:8px; border-radius:4px; overflow:hidden; margin-bottom:10px; }
        .progress-fill { background:var(--primary-green); height:100%; transition: width 0.3s ease; }
        .progress-stats { display:flex; justify-content:space-between; font-size:14px; color:var(--text-light); }
        .campaign-meta { display:flex; justify-content:space-between; font-size:14px; color:var(--text-light); }

        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index:1000; overflow-y:auto; }
        .modal-content { background:var(--bg-darker); margin:50px auto; padding:0; border-radius:15px; max-width:800px; width:90%; position:relative; animation: modalSlideIn 0.3s ease; }
        @keyframes modalSlideIn { from { opacity:0; transform: translateY(-50px) } to { opacity:1; transform: translateY(0) } }
        .modal-header { position:relative; height:300px; overflow:hidden; border-radius: 15px 15px 0 0; }
        .modal-header img { width:100%; height:100%; object-fit:cover; }
        .modal-close { position:absolute; top:15px; right:15px; background: rgba(0,0,0,0.7); color:white; border:none; width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:18px; transition: background 0.3s ease; }
        .modal-close:hover { background: rgba(0,0,0,0.9); }

        .amount-btn { padding:12px 20px; background:var(--bg-light); border:1px solid var(--border-color); border-radius:8px; color:var(--text-white); cursor:pointer; transition: all 0.3s ease; font-size:16px; font-weight:600; }
        .amount-btn:hover { background:var(--bg-darker); border-color:var(--accent-green); }
        .amount-btn.selected { background:var(--primary-green); color:var(--bg-black); border-color:var(--primary-green); }

        @media (max-width:768px) { .campaigns-grid { grid-template-columns:1fr } }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo"><i class="fas fa-leaf"></i><span>GreenFund</span></div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="campaigns.html" class="active">Campaigns</a></li>
                <li><a href="start-campaign.html">Start Campaign</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="admin-login.html">Admin</a></li>
            </ul>
            <div class="hamburger"><span></span><span></span><span></span></div>
        </div>
    </nav>

    <!-- Header -->
    <section class="page-header">
        <div class="container"><h1>All Campaigns</h1><p>Discover amazing projects</p></div>
    </section>

    <!-- Campaign Grid -->
    <section class="campaigns">
        <div class="container">
            <div class="campaigns-grid" id="campaignsGrid"></div>
            <div id="noResults" style="display:none; text-align:center; color:white; padding:40px;">
                <h3>No campaigns found</h3>
            </div>
        </div>
    </section>

    <!-- ===================== Modal ========================= -->
    <div class="modal" id="campaignModal">
        <div class="modal-content">
            <div class="modal-header">
                <img id="modalImage" src="images/default.png">
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <h2 id="modalTitle"></h2>
                <p id="modalDescription"></p>

                <div class="modal-details">
                    <div class="detail-item"><h4 id="modalRaised"></h4><p>Raised</p></div>
                    <div class="detail-item"><h4 id="modalGoal"></h4><p>Goal</p></div>
                    <div class="detail-item"><h4 id="modalBackers"></h4><p>Backers</p></div>
                    <div class="detail-item"><h4 id="modalDays"></h4><p>Days Left</p></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===================== JS ========================= -->

    <script>
        const API_BASE = "https://crowdfunding21-last-9.onrender.com/api";

        function getImageUrl(path) {
            if (!path) return "images/default.png";
            if (path.startsWith("http")) return path;
            return `https://crowdfunding21-last-9.onrender.com/${path.replace(/^\/+/, "")}`;
        }

        let campaigns = [];

        async function initializeCampaigns() {
            const grid = document.getElementById("campaignsGrid");

            try {
                const res = await fetch(`${API_BASE}/campaigns`);
                campaigns = await res.json();

                if (!campaigns.length) {
                    document.getElementById("noResults").style.display = "block";
                    return;
                }

                grid.innerHTML = campaigns.map(c => `
                    <div class="campaign-card" onclick="openCampaign(${c.id})">
                        <div class="campaign-image">
                            <img src="${getImageUrl(c.image)}">
                            <div class="campaign-badge">${c.badge || ""}</div>
                        </div>
                        <div class="campaign-content">
                            <h3>${c.title}</h3>
                            <p>${(c.description || "").substring(0, 100)}...</p>
                        </div>
                    </div>
                `).join("");

            } catch (err) {
                console.error(err);
                document.getElementById("noResults").style.display = "block";
            }
        }

        function openCampaign(id) {
            window.location.href = `campaign-detail.html?id=${id}`;
        }

        // FIXED selectAmount()
        function selectAmount(amount, event) {
            document.getElementById("customAmount").value = amount;

            document.querySelectorAll(".amount-btn")
                .forEach(btn => btn.classList.remove("selected"));

            event.target.classList.add("selected");
        }

        document.addEventListener("DOMContentLoaded", initializeCampaigns);
    </script>

</body>
</html>
