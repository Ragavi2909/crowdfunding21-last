<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - GreenFund</title>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />

    <!-- Global API + Main Script (load once only) -->
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="script.js"></script>

    <!-- Page-specific script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loginForm = document.getElementById("userLoginForm");

            // Read redirect / signup message from URL
            const params = new URLSearchParams(window.location.search);
            const redirectUrl = params.get("redirect");
            const fromSignup = params.get("signup");

            // If redirected from signup, show toast once
            if (fromSignup && typeof window.showNotification === "function") {
                window.showNotification("Signup successful! Please sign in.", "success");

                // Clean URL
                if (history && history.replaceState) {
                    const cleanURL = window.location.pathname + 
                        (redirectUrl ? `?redirect=${encodeURIComponent(redirectUrl)}` : "");
                    history.replaceState(null, "", cleanURL);
                }
            }

            // Form submit handler
            loginForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;

                try {
                    const userData = await AuthAPI.login({ email, password });

                    localStorage.setItem("user", JSON.stringify(userData));

                    // Redirect after login
                    window.location.href = redirectUrl || "index.html";
                } catch (error) {
                    showNotification("Login failed: " + (error.message || "Invalid credentials"), "error");
                }
            });
        });

        // Toggle eye icon visibility
        function togglePassword() {
            const input = document.getElementById("password");
            const icon = document.querySelector(".toggle-password i");

            const isHidden = input.type === "password";
            input.type = isHidden ? "text" : "password";

            icon.classList.toggle("fa-eye", !isHidden);
            icon.classList.toggle("fa-eye-slash", isHidden);
        }
    </script>

    <style>
        /* Password toggle styling */
        .toggle-password {
            background: none;
            border: none;
            cursor: pointer;
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            padding: 5px;
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-leaf"></i>
<span>GreenFund</span>
            </div>

            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="campaigns.html">Campaigns</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- User Login Section -->
    <section class="user-login">
        <div class="container">
            <div class="login-container">

                <div class="login-header">
                    <i class="fas fa-user-circle"></i>
                    <h1>Welcome Back</h1>
                    <p>Sign in to your account to continue supporting great causes</p>
                </div>

                <form id="userLoginForm" class="login-form">
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" required placeholder="Enter your email address">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" required placeholder="Enter your password">
                            
                            <span class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <span class="checkmark"></span>
                            Remember me
                        </label>

                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-login">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign In
                    </button>
                </form>

                <div class="login-divider">
                    <span>or</span>
                </div>

                <div class="social-login">
                    <button type="button" class="btn-social btn-google">
                        <i class="fab fa-google"></i>
                        Continue with Google
                    </button>

                    <button type="button" class="btn-social btn-facebook">
                        <i class="fab fa-facebook-f"></i>
                        Continue with Facebook
                    </button>
                </div>

                <div class="login-footer">
                    <p>Don't have an account? 
                        <a href="register.html" class="signup-link">Sign up here</a>
                    </p>

                    <a href="index.html" class="back-link">
                        <i class="fas fa-arrow-left"></i>
                        Back to Home
                    </a>
                </div>

            </div>
        </div>
    </section>

    <!-- Auto-show signup success only if needed -->
    <script>
        (function () {
            const qp = new URLSearchParams(window.location.search);
            
            if (qp.get("signup")) {
                setTimeout(() => {
                    if (window.showNotification) {
                        window.showNotification("Signup successful! Please sign in.", "success");
                    }
                }, 150);
            }
        })();
    </script>
</script>

<!-- NO MORE inline scripts here! -->

<!-- Load JS files ONCE (correct order) -->
<script src="config.js"></script>
<script src="api.js"></script>
<script src="script.js"></script>

</body>
</html>
